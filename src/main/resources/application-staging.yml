# staging: JSON 로그(요청 ID는 MDC requestId), 비밀값은 k8s Secret 환경변수
# Flyway migrate는 staging 배포 때만 한다(expand 마이그레이션, ADR-030). staging은 시뮬레이터 데이터만(vhost data2flow-stg)
logging:
  structured:
    format:
      console: ecs
    json:
      customizer: net.java21.data2flow.contracts.secret.SecretMaskingJsonMembersCustomizer
spring:
  datasource:
    url: jdbc:postgresql://${DATA2FLOW_DB_HOST_INTERNAL}:${DATA2FLOW_DB_PORT}/${DATA2FLOW_DB_NAME}?ApplicationName=data2flow-pipeline&socketTimeout=30&connectTimeout=5
data2flow:
  pipeline:
    flyway-mode: migrate
